name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build APKs
        run: |
          for app in customer_app supplier_app admin_app; do
            cd $app
            flutter create . --platforms=android
            flutter build apk --release
            cd ..
            mkdir -p out
            cp $app/build/app/outputs/flutter-apk/app-release.apk out/$app.apk
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/
