name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Build APKs
        run: |
          for app in customer_app supplier_app admin_app; do
            echo "Building $app"
            cd $app
            flutter pub get
            flutter build appbundle --release
            cd ..
          done
