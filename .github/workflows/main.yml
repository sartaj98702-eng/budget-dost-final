name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Fix google-services
        run: |
          for app in customer_app supplier_app admin_app; do
            PKG=$(grep -oP 'applicationId\s+"\K[^"]+' $app/android/app/build.gradle || grep -oP 'applicationId\s+\K\S+' $app/android/app/build.gradle.kts || echo "com.example.$app")
            PKG=$(echo $PKG | tr -d '"')
            echo "Making json for $app with package $PKG"
            mkdir -p $app/android/app
            cat > $app/android/app/google-services.json <<EOF
          {
            "project_info": {"project_number": "123456", "project_id": "budget-dost", "storage_bucket": "budget-dost.appspot.com"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:123456:android:abcdef", "android_client_info": {"package_name": "$PKG"}}, "oauth_client": [], "api_key": [{"current_key": "AIzaSyDummyKey"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
            "configuration_version": "1"
          }
          EOF
          done
      - name: Build Customer
        run: |
          cd customer_app
          flutter pub get
          flutter build appbundle --release --no-tree-shake-icons
