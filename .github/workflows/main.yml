name: Build AABs
on: { push: { branches: [ main ] } }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.19.0' }
      - run: cd customer_app && flutter pub get && flutter build appbundle
      - run: cd ../supplier_app && flutter pub get && flutter build appbundle
      - run: cd ../admin_app && flutter pub get && flutter build appbundle
      - uses: actions/upload-artifact@v3
        with: { name: aabs, path: '**/build/app/outputs/bundle/release/*.aab' }
