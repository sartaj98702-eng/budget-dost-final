name: Build AABs
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Check folders
        run: |
          ls -la
          echo "--- customer_app ---"
          ls -la customer_app || echo "customer_app not found"
          echo "--- find pubspec ---"
          find . -name "pubspec.yaml" | head -20

      - name: Build Customer App
        working-directory: customer_app
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Build Supplier App
        working-directory: supplier_app
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Build Admin App
        working-directory: admin_app
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Upload AABs
        uses: actions/upload-artifact@v4
        with:
          name: all-aabs
          path: |
            customer_app/build/app/outputs/bundle/release/*.aab
            supplier_app/build/app/outputs/bundle/release/*.aab
            admin_app/build/app/outputs/bundle/release/*.aab
