name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Customer
        run: |
          cd customer-app
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Build Supplier
        run: |
          cd supplier-app
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Build Admin
        run: |
          cd admin-app
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Upload AABs
        uses: actions/upload-artifact@v4
        with:
          name: aabs
          path: |
            customer-app/app/build/outputs/bundle/release/*.aab
            supplier-app/app/build/outputs/bundle/release/*.aab
            admin-app/app/build/outputs/bundle/release/*.aab
