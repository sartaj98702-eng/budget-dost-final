name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: DEBUG - Show Real Folder Names
        run: |
          echo "--- ROOT FOLDER LIST ---"
          ls -la
          echo "--- ALL PUBSPEC.YAML FILES ---"
          find . -name "pubspec.yaml" -maxdepth 5

      - name: Build All Apps Found
        run: |
          for PUB in $(find . -name "pubspec.yaml"); do
            DIR=$(dirname "$PUB")
            echo "========== Building in $DIR =========="
            cd "$DIR"
            flutter pub get
            flutter build appbundle --release
            cd -
          done

      - name: Upload AABs
        uses: actions/upload-artifact@v4
        with:
          name: aabs
          path: "**/build/app/outputs/bundle/release/*.aab"
