name: Build AABs
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug Structure
        run: |
          echo "=== PWD ==="
          pwd
          ls -la
          echo "=== All files ==="
          find . -type f | head -n 100
          echo "=== Searching pubspec ==="
          find . -iname "pubspec*"
