name: Build AABs
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Admin AAB
        run: |
          cd admin-app
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Build Customer AAB
        run: |
          cd customer-app
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Build Supplier AAB
        run: |
          cd supplier-app
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload All AABs
        uses: actions/upload-artifact@v4
        with:
          name: all-aabs
          path: |
            admin-app/app/build/outputs/bundle/release/*.aab
            customer-app/app/build/outputs/bundle/release/*.aab
            supplier-app/app/build/outputs/bundle/release/*.aab
