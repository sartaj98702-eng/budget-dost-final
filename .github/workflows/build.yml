name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Build Customer App
        run: |
          echo "Finding customer-app..."
          CUSTOMER_DIR=$(find customer-app -name "pubspec.yaml" | head -1 | xargs dirname)
          echo "Found at: $CUSTOMER_DIR"
          cd $CUSTOMER_DIR
          flutter pub get
          flutter build appbundle --release

      - name: Build Supplier App
        run: |
          echo "Finding supplier-app..."
          SUPPLIER_DIR=$(find supplier-app -name "pubspec.yaml" | head -1 | xargs dirname)
          echo "Found at: $SUPPLIER_DIR"
          cd $SUPPLIER_DIR
          flutter pub get
          flutter build appbundle --release

      - name: Build Admin App
        run: |
          echo "Finding admin-app..."
          ADMIN_DIR=$(find admin-app -name "pubspec.yaml" | head -1 | xargs dirname)
          echo "Found at: $ADMIN_DIR"
          cd $ADMIN_DIR
          flutter pub get
          flutter build appbundle --release

      - name: Upload AABs
        uses: actions/upload-artifact@v4
        with:
          name: aabs
          path: "**/build/app/outputs/bundle/release/*.aab"
