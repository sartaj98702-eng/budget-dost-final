name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build Customer
        run: |
          cd customer-app
          flutter pub get
          flutter build appbundle --release
      - name: Build Supplier
        run: |
          cd supplier-app
          flutter pub get
          flutter build appbundle --release
      - name: Build Admin
        run: |
          cd admin-app
          flutter pub get
          flutter build appbundle --release
      - name: Upload AABs
        uses: actions/upload-artifact@v4
        with:
          name: aabs
          path: |
            customer-app/build/app/outputs/bundle/release/*.aab
            supplier-app/build/app/outputs/bundle/release/*.aab
            admin-app/build/app/outputs/bundle/release/*.aab
