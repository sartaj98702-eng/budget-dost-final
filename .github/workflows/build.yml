name: Build AABs

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Admin AAB
        run: ./gradlew :admin-app:bundleRelease

      - name: Build Customer AAB
        run: ./gradlew :customer-app:bundleRelease

      - name: Build Supplier AAB
        run: ./gradlew :supplier-app:bundleRelease

      - name: Upload All AABs
        uses: actions/upload-artifact@v4
        with:
          name: all-aabs
          path: |
            admin-app/build/outputs/bundle/release/*.aab
            customer-app/build/outputs/bundle/release/*.aab
            supplier-app/build/outputs/bundle/release/*.aab
