name: Build AABs
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build All App Bundles
        run: |
          for PUB in $(find . -name "pubspec.yaml"); do
            DIR=$(dirname "$PUB")
            echo "==== Building $DIR ===="
            cd "$DIR"
            flutter pub get
            flutter build appbundle --release
            cd $GITHUB_WORKSPACE
          done

      - name: Upload AABs
        uses: actions/upload-artifact@v4
        with:
          name: all-aabs
          path: "**/build/app/outputs/bundle/release/*.aab"
