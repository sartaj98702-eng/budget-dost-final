name: Build AABs

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build Admin AAB
        run: gradle :admin-app:app:bundleRelease

      - name: Build Customer AAB
        run: gradle :customer-app:app:bundleRelease

      - name: Build Supplier AAB
        run: gradle :supplier-app:app:bundleRelease

      - name: Upload All AABs
        uses: actions/upload-artifact@v4
        with:
          name: all-aabs
          path: |
            admin-app/app/build/outputs/bundle/release/*.aab
            customer-app/app/build/outputs/bundle/release/*.aab
            supplier-app/app/build/outputs/bundle/release/*.aab
